name: Release
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Check tag matches package and chart versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          chart="$(awk '/^version:/ {print $2}' deploy/helm/secret-santa/Chart.yaml)"
          app="$(awk '/^appVersion:/ {gsub(/"/, "", $2); print $2}' deploy/helm/secret-santa/Chart.yaml)"
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH"; exit 1
          fi
          for v in "$pkg" "$chart" "$app"; do
            if [ "$v" != "$tag" ]; then
              echo "::error::Version mismatch: tag=$tag package=$pkg chart=$chart appVersion=$app"; exit 1
            fi
          done
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test
      - run: npm run build && npm run smoke:auth
  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        run: |
          v="${{ needs.verify.outputs.version }}"
          image="ghcr.io/${{ github.repository }}"
          {
            echo "tags<<EOF"
            echo "$image:$v"
            echo "$image:${v%.*}"
            echo "$image:sha-${{ github.sha }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
